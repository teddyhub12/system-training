<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ward 7, Bay B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#0b0d10;
  /* labels on things in the room: Keystream green chips */
  --chip:#F2F5F0; --chip-text:#1B3A44; --chip-line:#C9D6CF; --ring:#84E5AB;
  /* guidance (heads-up display, captions, menus): quiet dark glass over the room */
  --glass:rgba(17,21,27,.62); --glass-strong:rgba(17,21,27,.9); --line:rgba(255,255,255,.14);
  --ink:#F2F4F6; --ink-2:rgba(242,244,246,.72); --accent:#8EC5FF; --accent-ink:#0B1B2B; --ok:#A6E3BA; --err:#FFB3A7;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--stage);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --chip:#21454F; --chip-text:#C2F2D5; --chip-line:#2F5A63; --glass:rgba(17,21,27,.62); --ink:#F2F4F6; color-scheme:dark; }
}
:root[data-theme="dark"]{ --chip:#21454F; --chip-text:#C2F2D5; --chip-line:#2F5A63; --glass:rgba(17,21,27,.62); --ink:#F2F4F6; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--stage);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;color:var(--ink)}
button,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stage{position:relative;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;outline:none;cursor:grab}
.stage.dragging{cursor:grabbing}
.stage .gl{position:absolute;inset:0;z-index:1;display:block}
.stage .css3d{position:absolute!important;inset:0;z-index:0}
.stage.computer .gl{pointer-events:none}
.stage.computer{cursor:default}
.flat{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.flat .epr{position:absolute;left:0;top:0;pointer-events:auto}

.glass,.pill,.caption,.task,.toast,.menu{background:var(--glass);color:var(--ink);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px) saturate(1.1);backdrop-filter:blur(10px) saturate(1.1)}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.glass,.pill,.caption,.task,.toast,.menu{background:var(--glass-strong)}}

/* labels on things in the room */
.labels{position:absolute;inset:0;z-index:2;pointer-events:none}
.tag3d{position:absolute;left:0;top:0;pointer-events:auto;font-size:13px;font-weight:700;color:var(--chip-text);background:var(--chip);border:1px solid var(--chip-line);border-radius:999px;padding:3px 11px 3px 9px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.tag3d::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ring);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 2px rgba(27,58,68,.35)}
.tag3d:hover{filter:brightness(1.05)}
.tag3d.where{animation:where 1.3s ease-in-out infinite}
@keyframes where{0%,100%{box-shadow:0 0 0 3px var(--ring),0 2px 8px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 9px rgba(132,229,171,.25),0 2px 8px rgba(0,0,0,.35)}}
.tooltip{position:absolute;left:0;top:0;z-index:3;pointer-events:none;font-size:13px;font-weight:700;color:var(--chip-text);background:var(--chip);border:1px solid var(--chip-line);border-radius:8px;padding:3px 9px;white-space:nowrap}

.bar{position:absolute;z-index:4;left:12px;right:12px;top:12px;display:flex;gap:8px;justify-content:flex-end;align-items:flex-start;pointer-events:none}
.bar > *{pointer-events:auto}
.tools{display:flex;gap:6px}
.pill{border-radius:8px;min-height:34px;padding:5px 11px;cursor:pointer;font-weight:700;font-size:13px}
.pill:hover{border-color:var(--accent)}
.train-btn{margin-right:auto;font-size:14px;padding:7px 14px;animation:trainPulse 2.4s ease-out infinite}
.train-btn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ring);margin-right:8px;vertical-align:1px}
.train-btn.seen{animation:none}
@keyframes trainPulse{0%{box-shadow:0 0 0 0 rgba(132,229,171,.55)}70%{box-shadow:0 0 0 12px rgba(132,229,171,0)}100%{box-shadow:0 0 0 0 rgba(132,229,171,0)}}
.computer .train-btn{display:none}

/* close-up caption: the thing's name and what you can do with it */
.caption{position:absolute;z-index:4;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:min(560px,calc(100% - 24px));border-radius:10px;padding:8px 14px;font-size:14px;line-height:1.4;text-align:center}
.caption:empty,.computer .caption{display:none}
.acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:7px;align-items:center}
.act{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer;min-height:32px}
.act.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.act.chip{background:transparent;color:var(--ink);border-color:var(--line);font-weight:400;min-height:30px;padding:4px 10px}
.act.chip:hover,.act.sec:hover{border-color:var(--accent)}
.act.mini{min-height:26px;padding:2px 9px;font-size:12px}
.back{position:absolute;z-index:4;left:12px;bottom:16px}
.focused .caption{bottom:60px}
@media (min-width:760px){.focused .caption{bottom:16px}}

/* feedback: a short note that fades */
.toast{position:absolute;z-index:5;left:50%;bottom:96px;transform:translateX(-50%);width:max-content;max-width:min(480px,calc(100% - 24px));border-radius:999px;padding:7px 16px;font-size:14px;font-weight:700;pointer-events:none;animation:toastIn .25s ease-out}
.toast.ok{color:var(--ok)} .toast.err{color:var(--err);border-radius:12px}
.computer .toast{bottom:auto;top:14px}
@keyframes toastIn{from{transform:translate(-50%,8px)}to{transform:translate(-50%,0)}}

/* the heads-up display during a scenario */
.task{position:absolute;z-index:4;left:12px;top:12px;width:min(320px,calc(100% - 150px));border-radius:10px;padding:9px 12px 8px;font-size:14px;line-height:1.35}
.h-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);font-weight:700}
.h-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-title em{font-style:normal;color:var(--accent);margin-left:4px}
.h-dots{display:flex;gap:3px;margin-left:auto}
.h-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.h-dots i.d{background:var(--ink-2)} .h-dots i.c{background:var(--accent)}
.h-count{min-width:26px;text-align:right}
.h-step{font-weight:700;font-size:15px;margin:3px 0 2px}
.h-hand{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px;font-size:13px}
.h-hand .lbl{color:var(--ink-2);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 9px}
.chip button{border:0;background:none;color:var(--ink-2);cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
.chip button:hover{color:var(--ink)}
.chip.ok{color:var(--ok);border-color:rgba(166,227,186,.55)}
.chip.pop{animation:chipPop .5s ease-out}
@keyframes chipPop{0%{transform:scale(.6)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.h-hint{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--ink)}
.h-hint .act{display:block;margin-top:6px}
.h-acts{display:flex;gap:14px;margin-top:6px}
.h-acts button{border:0;background:none;color:var(--ink-2);font-size:12px;padding:0;cursor:pointer;text-decoration:underline;border-radius:4px}
.h-acts button:hover{color:var(--ink)}
.h-acts button.nudge{color:var(--accent);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{box-shadow:0 0 0 4px rgba(142,197,255,.25)}}
.computer .task{width:auto;max-width:min(620px,calc(100% - 220px));padding:6px 12px}
.computer .h-top,.computer .h-hand,.computer .h-acts,.computer .h-hint{display:none}
.computer .h-step{margin:0;font-size:14px}
.task.bump{animation:bump 1.2s ease-out}
@keyframes bump{0%{box-shadow:0 0 0 0 rgba(142,197,255,.6)}100%{box-shadow:0 0 0 12px rgba(142,197,255,0)}}

.menu-bg{position:absolute;inset:0;z-index:8;background:rgba(6,9,12,.4);display:flex;align-items:center;justify-content:center;padding:16px}
.menu{background:var(--glass-strong);border-radius:14px;padding:20px 20px 14px;width:min(480px,100%);max-height:100%;overflow:auto;box-shadow:0 16px 40px rgba(0,0,0,.4)}
.menu h2{margin:0 0 4px;font-size:20px}
.menu h3{font-size:14px;margin:12px 0 4px}
.menu p{margin:0 0 14px;color:var(--ink-2);line-height:1.45;font-size:14px}
.menu ul{margin:0 0 12px;padding-left:18px;line-height:1.45;font-size:14px}
.menu .clean{color:var(--ink);font-weight:700}
.scn{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.scn b{display:block;font-size:15px;margin-bottom:2px}
.scn span{display:block;font-size:13px;color:var(--ink-2);line-height:1.4}
.menu .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.linkish{border:0;background:none;color:var(--ink-2);text-decoration:underline;padding:6px 0 0;cursor:pointer;font-size:13px}

.rotate{position:absolute;z-index:4;inset:auto 12px 64px;border-radius:10px;padding:9px 12px;font-size:13px;text-align:center}
.loading{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;color:#cfd8dc;font-size:15px;background:var(--stage)}
@media (max-width:600px){.caption{font-size:13px}.task{font-size:13px}.toast{bottom:110px}}
@media (prefers-reduced-motion:reduce){.train-btn,.task.bump,.toast,.tag3d.where,.h-acts button.nudge,.chip.pop{animation:none}.tag3d.where{box-shadow:0 0 0 3px var(--ring)}.train-btn{border-color:var(--ring)}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
[hidden]{display:none!important}
/* ---------- the ward computer: flat, plain and dense, like a real clinical system ---------- */
.epr{width:1120px;height:800px;overflow:hidden;background:#fff;color:#1d2329;font-family:"Segoe UI",Arial,Helvetica,sans-serif;font-size:16px;line-height:1.4;user-select:text;-webkit-user-select:text;cursor:auto;position:relative}
.epr::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.08),transparent 35%,transparent 70%,rgba(0,0,0,.05))}
.stage:not(.computer) .epr{filter:brightness(.9)}
.epr button{font:inherit;cursor:pointer;color:inherit}
.epr .btn{border:1px solid #9aa4ae;background:#fff;color:#1d2329;border-radius:3px;padding:5px 13px;font-size:15px;line-height:1.3}
.epr .btn:hover{background:#f1f3f5}
.epr .btn.primary{background:#1f5f99;border-color:#1f5f99;color:#fff}
.epr .btn.primary:hover{background:#1a5287}
.epr .btn:disabled{opacity:.45;cursor:not-allowed}
.epr .lock{position:absolute;inset:0;background:#1d2733;color:#e8edf2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.epr .lock .clock{font-size:64px;font-weight:300;letter-spacing:-1px;line-height:1}
.epr .lock .where{font-size:16px;color:#aab6c2;margin:8px 0 28px}
.epr .lock p{font-size:14px;color:#aab6c2;margin:0 0 12px}
.epr .lock .btn.primary{background:#e8edf2;color:#1d2733;border-color:#e8edf2;padding:7px 30px;font-size:15px}
.epr .app{position:absolute;inset:0;display:grid;grid-template-rows:40px 48px minmax(0,1fr);grid-template-columns:210px minmax(0,1fr)}
.epr .topbar{grid-column:1/-1;background:#1d2733;color:#e8edf2;display:flex;align-items:center;gap:22px;padding:0 14px;font-size:14px}
.epr .topbar .name{font-weight:600;margin-right:auto;font-size:15px}
.epr .topbar .btn{background:transparent;color:#e8edf2;border-color:#4d5b69;padding:2px 10px;font-size:14px}
.epr .ptbar{grid-column:1/-1;display:flex;align-items:center;gap:20px;padding:0 14px;border-bottom:1px solid #cfd5db;background:#f6f7f8;font-size:15px}
.epr .ptbar .nm{font-weight:700;font-size:18px}
.epr .ptbar .meta{color:#56616c}
.epr .ptbar .alg{margin-left:auto;color:#b42318;font-weight:600}
.epr .nav{border-right:1px solid #cfd5db;background:#f6f7f8;padding:6px 0;display:flex;flex-direction:column}
.epr .nav button{border:0;border-left:3px solid transparent;background:none;text-align:left;padding:9px 14px;font-size:15px;color:#1d2329}
.epr .nav button:hover{background:#eceff2}
.epr .nav button[aria-current="true"]{border-left-color:#1f5f99;background:#fff;font-weight:600}
.epr .main{overflow:auto;padding:16px 22px}
.epr .main h1{font-size:21px;font-weight:600;margin:0 0 12px}
.epr .main h2{font-size:15px;font-weight:600;margin:22px 0 4px;color:#56616c}
.epr .muted{color:#56616c}
.epr table.t{width:100%;border-collapse:collapse;font-size:15px}
.epr table.t th{text-align:left;font-weight:600;color:#56616c;font-size:14px;padding:6px 8px;border-bottom:1px solid #9aa4ae}
.epr table.t td{padding:9px 8px;border-bottom:1px solid #e3e7eb;vertical-align:middle}
.epr table.t td.r{text-align:right}
.epr table.t tr.due td{background:#f3f7fb}
.epr table.t tr.new td{background:#f2f8f3}
.epr .due-txt{color:#1f5f99;font-weight:600}
.epr .flag{color:#b42318;font-weight:600}
.epr .notice{border-left:3px solid #2e7d4f;background:#f2f8f3;padding:8px 12px;margin:0 0 14px;font-size:15px}
.epr .notice.err{border-left-color:#b42318;background:#fdf2f1;color:#8f1d14;margin:10px 0 0}
.epr .form{border:1px solid #cfd5db;padding:12px 14px;margin:0 0 18px}
.epr .form .row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.epr .form .row .btn{margin-left:auto}
.epr .radio{display:inline-flex;align-items:center;gap:6px;font-size:16px;cursor:pointer}
.epr .radio input{width:16px;height:16px;margin:0;accent-color:#1f5f99;cursor:pointer}
.epr .form .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.epr dl.kv{display:grid;grid-template-columns:160px 1fr;gap:7px 12px;margin:0;font-size:15px}
.epr dl.kv dt{color:#56616c}
.epr dl.kv dd{margin:0}
.epr .note{border-bottom:1px solid #e3e7eb;padding:8px 0;font-size:15px}
.epr .note .h{color:#56616c;font-size:13px}
.epr textarea{width:100%;min-height:70px;border:1px solid #9aa4ae;border-radius:2px;padding:6px 8px;font:inherit;font-size:14px;margin:4px 0 8px}
.epr .dlg-bg{position:absolute;inset:0;background:rgba(20,26,32,.35);display:flex;align-items:center;justify-content:center;z-index:20}
.epr .dlg{width:540px;background:#fff;border:1px solid #9aa4ae;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.epr .dlg h3{margin:0;padding:10px 14px;font-size:16px;font-weight:600;border-bottom:1px solid #e3e7eb;display:flex;justify-content:space-between;align-items:center}
.epr .dlg h3 button{border:0;background:none;font-size:20px;line-height:1;color:#56616c}
.epr .dlg .bd{padding:12px 14px;font-size:15px}
.epr .dlg .ft{padding:10px 14px;border-top:1px solid #e3e7eb;display:flex;gap:8px;justify-content:flex-end;align-items:center}
.epr .dlg .ft .muted{margin-right:auto;font-size:13px}
.epr .chk{list-style:none;margin:0;padding:0;border-top:1px solid #e3e7eb}
.epr .chk li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #e3e7eb}
.epr .chk .n{width:24px;height:24px;border-radius:50%;border:1.5px solid #9aa4ae;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#56616c}
.epr .chk li.ok .n{background:#2e7d4f;border-color:#2e7d4f;color:#fff}
.epr .chk b{font-weight:600}
.epr .chk .s{display:block;color:#56616c;font-size:14px}
.epr .chk li.ok .s{color:#2e7d4f}
.epr .tag{font-size:13px;padding:2px 8px;border:1px solid #c3cad1;border-radius:3px;color:#56616c;white-space:nowrap}
.epr .tag.done{border-color:#2e7d4f;color:#2e7d4f;background:#f2f8f3}
.epr .scan-bg{position:absolute;inset:0;z-index:30;background:rgba(20,26,32,.4);display:flex;align-items:center;justify-content:center}
.epr .scan{width:660px;background:#fff;border:1px solid #9aa4ae;border-top:10px solid #2e7d4f;box-shadow:0 12px 30px rgba(0,0,0,.25);padding:24px 28px;text-align:center}
.epr .scan.bad{border-top-color:#b42318}
.epr .scan h2{margin:0 0 8px;font-size:36px;font-weight:600;color:#1d2329}
.epr .scan h2 span{color:#2e7d4f}
.epr .scan.bad h2 span{color:#b42318}
.epr .scan p{margin:0 0 18px;font-size:20px;color:#3d4650}

</style>
</head>
<body>
<div class="stage" id="stage" tabindex="0" aria-label="A hospital bay in 3D. Drag to look around, scroll or pinch to zoom. Use the labels to look at things.">
  <div class="labels" id="labels"></div>
  <div class="flat" id="flat"></div>
  <div class="tooltip" id="tooltip" hidden></div>
  <div class="bar">
    <button class="pill train-btn" id="trainBtn" type="button">Complete scenario training</button>
    <div class="tools">
      <button class="pill" id="scnBtn" type="button">Scenarios</button>
      <button class="pill" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
    </div>
  </div>
  <div class="task" id="task" role="region" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="caption" id="caption" aria-live="polite"></div>
  <button class="pill back" id="backBtn" type="button" hidden>Back to the bay</button>
  <div class="rotate glass" id="rotateHint" hidden>Turn your phone sideways to use the computer.</div>
  <div class="menu-bg" id="menu" hidden><div class="menu" role="dialog" aria-modal="true" aria-labelledby="menuTitle"></div></div>
  <div class="menu-bg" id="done" hidden><div class="menu" role="dialog" aria-modal="true" aria-labelledby="doneTitle"></div></div>
  <div class="loading" id="loading">Setting up the bay</div>
</div>
<script src="vendor/three/build/three.min.js"></script>
<script src="vendor/three/examples/js/renderers/CSS3DRenderer.js"></script>
<script src="vendor/three/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script>
if(!window.THREE){ document.getElementById('loading').textContent = 'The 3D library didn’t load. Check your connection and reload.'; }
/* ================= 3D bay ================= */
const stage = document.getElementById('stage');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const col = h => new THREE.Color(h).convertSRGBToLinear();
let mode = 'explore'; // explore | focus | computer
// what the learner has done in the bay (the ward computer keeps its own state in E)
const WS = { wristAt:null, paraAt:null, givenAt:null, monitorChecked:false, scannerHeld:false, scannerTaken:false, wristScanned:false, drawerOpen:false, pack:null, paraScanned:false, given:false, msg:null, mistakes:[] };

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.physicallyCorrectLights = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x0b0d10, 1);
renderer.domElement.className = 'gl';
const cssRenderer = new THREE.CSS3DRenderer();
cssRenderer.domElement.className = 'css3d';
stage.prepend(renderer.domElement);
stage.prepend(cssRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.02, 120);

/* ---------- helpers ---------- */
function ctex(w, h, draw, repeat){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
  if(repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  t.userData = { c, g }; return t;
}
const rnd = (() => { let s = 7; return () => (s = (s*16807) % 2147483647) / 2147483647; })();

const clock = new THREE.Clock(); let tPrev = 0, lastBeat = 0;
const tmpQ = new THREE.Quaternion(), right = new THREE.Vector3(), up = new THREE.Vector3();
function frame(){
  const t = clock.getElapsedTime(), dt = Math.min(.05, t - tPrev); tPrev = t;
  if(fly){
    const k = fly.dur ? Math.min(1, (performance.now() - fly.t0)/fly.dur) : 1, e = ease(k);
    camera.position.lerpVectors(fly.p0, fly.p1, e); camera.position.y += Math.sin(Math.PI*e) * .08 * (fly.p0.distanceTo(fly.p1) > 1 ? 1 : 0);
    camera.quaternion.slerpQuaternions(fly.q0, fly.q1, e);
    camera.fov = fly.f0 + (fly.f1 - fly.f0)*e;
    if(k >= 1){ const done = fly.done; look.pos.copy(fly.p1); look.fov = fly.f1; setLookFromQuat(fly.q1); fly = null; done && done(); }
  } else if(mode !== 'computer'){
    parallax.x += (parallax.tx - parallax.x)*.06; parallax.y += (parallax.ty - parallax.y)*.06;
    camera.quaternion.setFromEuler(new THREE.Euler(look.pitch, look.yaw, 0, 'YXZ'));
    right.set(1,0,0).applyQuaternion(camera.quaternion); up.set(0,1,0).applyQuaternion(camera.quaternion);
    const amp = mode === 'explore' ? 1 : .35;
    camera.position.copy(look.pos).addScaledVector(right, parallax.x*.06*amp).addScaledVector(up, -parallax.y*.035*amp);
    camera.fov += (look.fov - camera.fov)*.15;
  }
  camera.updateProjectionMatrix();
  // living details
  drawMonitor(t, dt); if(Math.floor(t*4) !== Math.floor((t-dt)*4)) drawPump(t);
  if(Math.floor(t/20) !== Math.floor((t-dt)/20)) drawClock();
  if(t - lastBeat > beat){ lastBeat = t; if(current === 'monitor') beep(true, .025, 980); }
  blanket.scale.y = 1 + Math.sin(t*2*Math.PI*18/60)*.004; fold.scale.y = blanket.scale.y; torso.scale.y = 1 + Math.sin(t*2*Math.PI*18/60)*.03;
  const dp = (t*1.4) % 1; drop.position.y = 1.735 - dp*.05; drop.visible = dp < .9;
  train.position.x = -14 + ((t*1.6) % 34);
  const kDraw = 1 - Math.exp(-Math.min(.5, t - (frame.tLast || t))*9); frame.tLast = t;
  drawers.forEach(d => { const u = d.userData; u.open += (u.target - u.open)*kDraw; d.position.z = u.open*(d === drawers[0] ? .38 : .3); });
  const nowMs = performance.now();
  for(let k = anims.length - 1; k >= 0; k--){ const a = anims[k], u = Math.min(1, (nowMs - a.t0)/a.dur); a.fn(u); if(u >= 1){ anims.splice(k, 1); a.done && a.done(); } }
  renderer.render(scene, camera); if(!eprFlat) cssRenderer.render(scene, camera);
  // labels follow their objects
  const showLabels = mode === 'explore' && !fly;
  labelEls.forEach(({ it, b }) => {
    const p = it.anchor().project(camera);
    const vis = showLabels && !(it.hidden && it.hidden()) && p.z < 1 && Math.abs(p.x) < 1.05 && Math.abs(p.y) < 1.05;
    b.style.display = vis ? '' : 'none';
    if(vis) b.style.transform = `translate(${(p.x*.5+.5)*W_}px,${(-p.y*.5+.5)*H_}px) translate(-50%,-100%)`;
  });
  requestAnimationFrame(frame);
}

epr.addEventListener('click', e => {

    case 'login': E.loggedIn = true; E.page = 'summary'; break;
    case 'lock': E.loggedIn = false; E.admin = false; E.adminConfirm = false; E.hrForm = false; E.hrConfirm = false; break;
    case 'nav': E.page = b.dataset.v; E.admin = false; if(E.page === 'obs') E.obsOpened = true; if(E.page === 'drugs') E.chartViewed = true; break;
    case 'hrform': E.hrForm = true; E.hrChoice = null; E.hrError = null; break;
    case 'hrpick': E.hrChoice = +b.dataset.v; E.hrError = null; break;
    case 'hrcancel': E.hrForm = false; E.hrChoice = null; E.hrError = null; break;
    case 'hrconfirm':
      if(E.hrChoice !== HR){ beep(false); E.hrError = `${E.hrChoice} bpm doesn’t match the bedside monitor. Check the monitor and try again.`; mistake(`Chose ${E.hrChoice} bpm when the monitor showed ${HR} bpm.`); }

    case 'hrok': E.hrLogged = { t:now(), hr:E.hrChoice }; E.hrConfirm = false; E.hrForm = false; beep(true, .03, 880); break;

});

/* ================= Training scenarios =================
   Pattern: brief, then a quiet heads-up display. The learner sees the goal and the next
   step in a few words; fuller help is there on request (Hint, then Show me where), and the
   learner can choose a test run with no help at all. Feedback is short, appears where the
   action happened and fades. Everything is reviewed in the debrief at the end. */
const SCENARIOS = {
  obs: {

    brief:'22:00 on Ward 7. Robin Training in Bed 4 is due a heart rate check.',

      { s:'Log in to the computer', t:'The ward computer is the laptop on the drug trolley. Select it and log in.', target:'laptop', done:() => E.loggedIn },
      { s:'Open observations', t:'In the patient record, open Assessments and observations.', target:'laptop', done:() => E.obsOpened },
      { s:'Record the heart rate', t:'Select Record heart rate, choose the value from the monitor, confirm it, then select OK.', target:'laptop', done:() => !!E.hrLogged }
    ]
  },
  para: {
    title:'Give paracetamol', label:'Scenario 2',
    brief:'22:00 on Ward 7. Paracetamol 1 g is due for Robin Training in Bed 4. Prepare it at the trolley, check and give it at the bedside, then record it.',
    goal:'Prepare, check, give and record the paracetamol that’s due.',
    steps:[
      { s:'Check the drug chart', t:'Log in to the ward computer on the drug trolley and open the Drug chart to see what’s due.', target:'laptop', done:() => E.chartViewed },
      { s:'Get the paracetamol', t:'Open the drugs drawer on the trolley and pick out the paracetamol. Check the name and strength.', target:'trolley', done:() => WS.pack === 'para' || WS.paraScanned || WS.given },
      { s:'Take the scanner', t:'The handheld scanner sits on top of the trolley. You’ll need it at the bedside.', target:'scanner', done:() => WS.scannerTaken },
      { s:'Scan Robin’s wristband', t:'At the bedside, scan the wristband first so the computer knows who the medicine is for.', target:'patient', done:() => WS.wristScanned },
      { s:'Scan the paracetamol', t:'Now scan the pack. The computer checks the drug and dose against the chart.', target:'patient', done:() => WS.paraScanned },
      { s:'Give it to Robin', t:'Give the paracetamol and make sure Robin takes it.', target:'patient', done:() => WS.given },
      { s:'Record it as given', t:'Back at the computer, open the Drug chart, select Administer, then Record as given.', target:'laptop', done:() => !!E.signed }
    ]
  }
};
let active = null, visitDone = false, lastStep = -1, hintOpen = false, hintUntil = Date.now() + 8000;

// the learner finds the next thing themselves
const AREA = { monitor:'monitor', laptop:'trolley', glance:'trolley', scanner:'trolley', trolley:'trolley', drawer:'trolley', wrist:'bed', patient:'bed', board:'bed', pump:'bed', window:'window' };
const taskEl = document.getElementById('task'), toastEl = document.getElementById('toast');
const menuEl = document.getElementById('menu'), doneEl = document.getElementById('done');
const PACK = id => PACKS.find(p => p.id === id);
const mistake = text => { if(active && !WS.mistakes.includes(text)) WS.mistakes.push(text); };
const curStep = () => active ? active.s.steps.findIndex(st => !st.done()) : -1;

function resetWorld(){
  Object.assign(WS, { wristAt:null, paraAt:null, givenAt:null, monitorChecked:false, scannerHeld:false, scannerTaken:false, wristScanned:false, drawerOpen:false, pack:null, paraScanned:false, given:false, msg:null, mistakes:[] });
  gun.visible = true; PACKS.forEach(p => { p.group.visible = true; p.group.position.y = -.028; p.group.scale.setScalar(1); }); trayG.visible = false; trayG.userData.leaving = false; headPivot.rotation.x = 0;
  drawers.forEach(d => { d.userData.target = 0; });
  clearTimeout(flashT); resetEPR();
  if(mode === 'computer') exitComputer(); else goHome();
}
function startScenario(id, runMode){
  resetWorld();
  active = { id, s:SCENARIOS[id], mode:runMode, t0:Date.now(), finished:false, hints:0, where:-1, stepAt:Date.now() };
  hintOpen = false; menuEl.hidden = true; doneEl.hidden = true; hintUntil = 0;
  fire(); stage.focus({ preventScroll:true });
}
function liftOut(g){ tween(380, u => { g.position.y = -.028 + .09*u; g.scale.setScalar(1 - u*.9); }, () => { g.visible = false; g.position.y = -.028; g.scale.setScalar(1); }); }
function dropIn(g){ g.visible = true; tween(380, u => { g.position.y = -.028 + .09*(1 - u); g.scale.setScalar(.1 + .9*u); }); }
// the medicine and a pot sit on the bedside locker while you're at the bedside holding them
function updateTray(){
  const show = !!WS.pack && mode === 'focus' && AREA[current] === 'bed';
  if(trayG.userData.leaving) return;
  if(show && !trayG.visible){
    trayTop.material.map = PACK(WS.pack).tex; trayTop.material.needsUpdate = true;
    tablets.forEach(tb => { tb.visible = WS.pack === 'para'; tb.position.copy(tb.userData.home); tb.scale.set(1, .42, 1); });
    trayG.visible = true; tween(320, u => trayG.scale.setScalar(.5 + .5*easeOutBack(u)));
  } else if(!show && trayG.visible) trayG.visible = false;
}
function returnItems(){
  WS.scannerHeld = false; gun.visible = true;
  if(WS.pack){ PACK(WS.pack).group.visible = true; WS.pack = null; }
  trayG.visible = false;
}
function endScenario(){ active = null; hintOpen = false; returnItems(); fire(); }

/* everything the learner does ends here */
function fire(){
  if(active && !active.finished){
    const c = active.s.steps.filter(st => st.done()).length;
    if(c > (active.count || 0)){
      if(mode === 'focus') visitDone = true;
      // a quiet tick for steps that didn't already say something
      if(!WS.msg){ const k = active.s.steps.findIndex((st, n) => n >= (active.count || 0) && st.done()); if(k >= 0) WS.msg = { ok:true, text:`✓ ${active.s.steps[k].s}` }; }
    }
    active.count = c;
  }
  if(WS.msg){ toast(WS.msg); WS.msg = null; }
  renderTask(); updateCaption(); renderEPR(); updateTray();
  if(active && !active.finished && curStep() === -1){ active.finished = true; setTimeout(showDone, 2000); }
}

/* short feedback near where things happen, then it fades */
let toastT = null;
function toast(m){
  toastEl.className = 'toast glass ' + (m.ok ? 'ok' : 'err');
  toastEl.setAttribute('role', m.ok ? 'status' : 'alert');
  toastEl.textContent = m.text; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { toastEl.hidden = true; }, m.ok ? 3200 : 6500);
}

/* the heads-up display: goal or next step, progress, what's in your hand, help on request */
function renderTask(){
  document.getElementById('trainBtn').hidden = !!active;
  document.getElementById('scnBtn').hidden = !active;
  const i = curStep();
  if(active && i !== lastStep){
    taskEl.classList.remove('bump'); void taskEl.offsetWidth; taskEl.classList.add('bump');
    active.stepAt = Date.now(); active.where = -1; hintOpen = false;
  }
  lastStep = active ? i : -1;
  labelEls.forEach(({ id, b }) => b.classList.toggle('where', !!active && i >= 0 && active.where === i && active.s.steps[i].target === id));
  const held = [], keys = [];
  const chip = (key, cls, html) => { keys.push(key); held.push(`<span class="chip ${cls}${renderTask.keys && !renderTask.keys.includes(key) ? ' pop' : ''}">${html}</span>`); };
  if(WS.scannerHeld) chip('scanner', '', `Scanner<button type="button" data-a="putscanner" aria-label="Put the scanner back">×</button>`);
  if(WS.pack){ const k = PACK(WS.pack), scanned = WS.pack === 'para' && WS.paraScanned;
    chip(WS.pack + (scanned ? '-ok' : ''), scanned ? 'ok' : '', `${k.name}${scanned ? ' ✓' : ''}${WS.given ? '' : `<button type="button" data-a="putback" aria-label="Put the ${k.name.toLowerCase()} back">×</button>`}`); }
  renderTask.keys = keys;
  const hand = held.length ? `<div class="h-hand"><span class="lbl">In hand</span>${held.join('')}</div>` : '';
  if(!active){ taskEl.hidden = !held.length; taskEl.innerHTML = hand; return; }
  const steps = active.s.steps, n = steps.length, done = i === -1;
  taskEl.hidden = false;
  taskEl.innerHTML = `<div class="h-top"><span class="h-title">${active.s.title}${active.mode === 'test' ? ' <em>Test</em>' : ''}</span>
      <span class="h-dots" aria-hidden="true">${steps.map((st, k) => `<i class="${st.done() ? 'd' : k === i ? 'c' : ''}"></i>`).join('')}</span>
      <span class="h-count">${done ? n : i+1}/${n}</span></div>
    <div class="h-step">${done ? 'All done' : guided() ? steps[i].s : active.s.goal}</div>
    ${hand}
    ${guided() && hintOpen && !done ? `<div class="h-hint">${steps[i].t}<button type="button" class="act mini sec" data-t="where">Show me where</button></div>` : ''}
    <div class="h-acts">${guided() && !done ? `<button type="button" data-t="hint" class="${Date.now() - active.stepAt > 45000 && !hintOpen ? 'nudge' : ''}" aria-expanded="${hintOpen}">${hintOpen ? 'Hide hint' : 'Hint'}</button>` : ''}<button type="button" data-t="exit">Exit</button></div>`;
  taskEl.setAttribute('aria-label', `${active.s.label}: ${active.s.title}. Step ${done ? n : i+1} of ${n}.`);
}
// a gentle nudge towards the hint if someone's been stuck on a step for a while
setInterval(() => { if(guided() && !active.finished && !hintOpen && Date.now() - active.stepAt > 45000){ const h = taskEl.querySelector('[data-t="hint"]'); if(h && !h.classList.contains('nudge')) h.classList.add('nudge'); } }, 5000);

/* close-up captions: just the name of the thing and what you can do with it */
const NAMES = { drawer:'Drugs drawer', glance:'Ward computer', patient:'Robin Training, Bed 4', wrist:'Robin’s wristband' };
function updateCaption(){
  if(mode === 'computer'){ caption.innerHTML = ''; return; }
  if(mode !== 'focus'){ caption.innerHTML = Date.now() < hintUntil ? HINT : ''; return; }
  const id = current, acts = [];
  if(id === 'scanner') acts.push(WS.scannerHeld ? ['putscanner', 'Put the scanner back', 'sec'] : ['pickup', 'Pick up the scanner']);
  if(id === 'wrist' || id === 'patient'){
    // practice shows the next bedside check only; a test offers everything, so the order is up to the learner
    const free = !guided(), med = WS.pack ? PACK(WS.pack).name.toLowerCase() : '';
    if(!WS.wristScanned || free) acts.push(['scanwrist', WS.wristScanned ? 'Scan the wristband again' : 'Scan the wristband', WS.wristScanned ? 'sec' : '']);
    if(id === 'patient' && WS.pack && !(WS.pack === 'para' && WS.paraScanned) && (free || WS.wristScanned)) acts.push(['scanpack', `Scan the ${med}`]);
    if(id === 'patient' && WS.pack && !WS.given && (free || WS.paraScanned)) acts.push(['give', `Give the ${med}`]);
  }
  if(id === 'drawer'){
    if(WS.pack){ acts.push(['closedrawer', 'Close the drawer']); acts.push(['putback', 'Put it back', 'sec']); }
    else PACKS.filter(p => p.group.visible).forEach(p => acts.push(['pack:' + p.id, p.name, 'chip']));
  }
  const i = curStep(), tgt = i >= 0 ? active.s.steps[i].target : null;
  if(tgt && visitDone && AREA[tgt] !== AREA[id]) acts.push(['next', 'Continue', 'sec']);
  caption.innerHTML = `<b>${NAMES[id] || ITEMS[id].tag}</b>${acts.length ? `<div class="acts">${acts.map(([a, l, k]) => `<button class="act ${k || ''}" type="button" data-a="${a}">${l}</button>`).join('')}</div>` : ''}`;
}

/* actions in the bay */
// Continue always returns to the same overview of the bay, where every station is in view:
// a predictable hub makes it easy to get from the trolley to the bedside, but the learner still chooses
function pullBack(){ goHome(); }
function primaryAction(id){ if(id === 'scanner') (WS.scannerHeld ? putScannerBack() : pickUpScanner()); else if(id === 'wrist') scanWrist(); else if(id === 'patient') give(); }
function putScannerBack(){
  if(!WS.scannerHeld) return;
  WS.scannerHeld = false; gun.visible = true; beep(true, .02, 520);
  WS.msg = { ok:true, text:'Scanner back in its cradle' }; fire();
}
function pickUpScanner(){
  if(WS.scannerHeld) return;
  WS.scannerHeld = true; WS.scannerTaken = true; gun.visible = false; setHover(null); beep(true, .02, 660);
  WS.msg = { ok:true, text:'✓ Scanner picked up' }; fire();
}
function scanWrist(){
  if(!WS.scannerHeld){ WS.msg = { ok:false, text:'You need the barcode scanner first.' }; fire(); return; }
  beep(); WS.wristScanned = true; WS.wristAt = WS.wristAt || now();
  scanFx(idPanel, .064, .024, true, [band, idPanel]);
  flash(true, 'Patient confirmed', 'Robin Training, born 22/07/1968. NHS number 999 345 6780.');
  WS.msg = { ok:true, text:'✓ Wristband scanned: Robin Training' }; fire();
}
function toggleDrawer(d){
  const u = d.userData, opening = !u.target; u.target = opening ? 1 : 0; beep(true, .02);
  if(d !== drawers[0]) return;
  if(opening){ WS.drawerOpen = true; goTo('drawer'); }
  else if(current === 'drawer') goTo('trolley');
}
function pickPack(id){
  if(WS.given && id === 'para') return;
  if(WS.pack === id) return;
  if(WS.pack) dropIn(PACK(WS.pack).group);
  WS.pack = id; liftOut(PACK(id).group); setHover(null); beep(true, .02, 560);
  WS.msg = { ok:true, text:`Picked up ${PACK(id).name.toLowerCase()}` }; fire();
}
function putBack(){
  if(!WS.pack) return;
  dropIn(PACK(WS.pack).group); WS.pack = null;
  WS.msg = { ok:true, text:'Pack back in the drawer' }; fire();
}
function scanPack(){
  if(!WS.pack) return;
  const k = PACK(WS.pack);
  if(!WS.scannerHeld){ WS.msg = { ok:false, text:'You need the barcode scanner first.' }; fire(); return; }
  if(!WS.wristScanned){ beep(false); mistake('Scanned a medicine before scanning the patient’s wristband.'); WS.msg = { ok:false, text:'Scan the patient’s wristband first, so the computer knows who the medicine is for.' }; fire(); return; }
  if(k.id !== 'para'){
    beep(false); mistake(`Picked up ${k.name.toLowerCase()} instead of paracetamol.`);
    if(trayG.visible) scanFx(trayTop, .098, .063, false, trayPack);
    flash(false, 'Wrong medicine', k.why);
    WS.msg = { ok:false, text:k.why }; fire(); return;
  }
  beep(); WS.paraScanned = true; WS.paraAt = now();
  if(trayG.visible) scanFx(trayTop, .098, .063, true, trayPack);
  flash(true, 'Correct dose scanned', 'Paracetamol 500 mg tablets × 2 = 1 g. This matches the drug chart.');
  WS.msg = { ok:true, text:'✓ Correct dose: paracetamol 500 mg × 2 = 1 g' }; fire();
}
function give(){
  if(WS.given) return;
  if(WS.pack !== 'para'){ WS.msg = { ok:false, text: WS.pack ? 'That isn’t the medicine that’s due.' : 'You aren’t holding any medicine.' }; fire(); return; }
  if(!WS.paraScanned){ beep(false); mistake('Tried to give the paracetamol before scanning it.'); WS.msg = { ok:false, text:'Scan the paracetamol before you give it.' }; fire(); return; }
  WS.given = true; WS.givenAt = now(); WS.pack = null; beep(true, .02, 880);
  if(trayG.visible){
    trayG.userData.leaving = true;
    const mouth = trayG.worldToLocal(headG.localToWorld(V(0, .27, -.52)));
    tablets.forEach((tb, n) => { const a = tb.userData.home.clone();
      tween(700 + n*120, u => { tb.position.lerpVectors(a, mouth, u); tb.position.y += Math.sin(Math.PI*u)*.12; tb.scale.setScalar(1 - .7*u); tb.scale.y *= .42; }, () => { tb.visible = false; }); });
    setTimeout(() => tween(900, u => { headPivot.rotation.x = Math.sin(Math.PI*u)*.14; }, () => { headPivot.rotation.x = 0; }), 650);
    setTimeout(() => tween(300, u => trayG.scale.setScalar(1 - u), () => { trayG.visible = false; trayG.userData.leaving = false; trayG.scale.setScalar(1); }), 1700);
  }
  WS.msg = { ok:true, text:'✓ Robin has taken the paracetamol' }; fire();
}
function showWhere(){
  const i = curStep(); if(!active || i < 0) return;
  active.where = i; active.hints++;
  if(mode === 'computer') exitComputer(); else if(mode === 'focus') goHome(); else fire();
}
function act(a){
  if(a === 'pickup') pickUpScanner();
  else if(a === 'scanwrist') scanWrist();
  else if(a === 'give') give();
  else if(a === 'scanpack') scanPack();
  else if(a === 'putback') putBack();
  else if(a === 'putscanner') putScannerBack();
  else if(a.startsWith('pack:')) pickPack(a.slice(5));
  else if(a === 'next') pullBack();
  else if(a === 'closedrawer') toggleDrawer(drawers[0]);
}
caption.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if(b) act(b.dataset.a); });
taskEl.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if(a){ act(a.dataset.a); return; }
  const b = e.target.closest('[data-t]'); if(!b) return;
  if(b.dataset.t === 'exit') endScenario();
  else if(b.dataset.t === 'hint'){ if(!hintOpen) active.hints++; hintOpen = !hintOpen; renderTask(); }
  else if(b.dataset.t === 'where') showWhere();
});

/* choosing a scenario, and the debrief */
function showMenu(){
  menuEl.querySelector('.menu').innerHTML = `<h2 id="menuTitle">Scenario training</h2>
    <p>Practise with hints available, or test yourself with no help.</p>
    ${Object.entries(SCENARIOS).map(([id, s]) => `<div class="scn"><b>${s.label}: ${s.title}</b><span>${s.brief}</span>
      <div class="row"><button class="act" type="button" data-s="${id}" data-m="guided">Practise</button><button class="act sec" type="button" data-s="${id}" data-m="test">Test yourself</button></div></div>`).join('')}
    <button class="linkish" type="button" data-s="explore">Close</button>`;
  menuEl.hidden = false; menuEl.querySelector('.act').focus({ preventScroll:true });
}
function showDone(){
  const s = active.s, secs = Math.round((Date.now() - active.t0)/1000), other = active.id === 'obs' ? 'para' : 'obs';
  const time = `${Math.floor(secs/60)} min ${String(secs%60).padStart(2,'0')} s`, clean = !WS.mistakes.length;
  const meta = [active.mode === 'test' ? 'Test' : 'Practice', time, active.mode === 'guided' ? `${active.hints} hint${active.hints === 1 ? '' : 's'} used` : ''].filter(Boolean).join(' · ');
  doneEl.querySelector('.menu').innerHTML = `<h2 id="doneTitle">${active.mode === 'test' ? (clean ? 'Passed' : 'Not quite') : 'Scenario complete'}</h2>
    <p>${s.label}: ${s.title}<br>${meta}</p>
    ${clean ? '<p class="clean">Every check done, in the right order.</p>' : `<h3>To review</h3><ul>${WS.mistakes.map(m => `<li>${m}</li>`).join('')}</ul>`}
    <div class="row">${active.mode === 'guided' ? `<button class="act" type="button" data-s="${active.id}" data-m="test">Test yourself</button><button class="act sec" type="button" data-s="${active.id}" data-m="guided">Practise again</button>`
      : `<button class="act" type="button" data-s="${active.id}" data-m="test">Try again</button>`}
      <button class="act sec" type="button" data-s="${other}" data-m="guided">${SCENARIOS[other].label}</button><button class="act sec" type="button" data-s="explore">Close</button></div>`;
  doneEl.hidden = false; doneEl.querySelector('.act').focus({ preventScroll:true });
}
[menuEl, doneEl].forEach(el => el.addEventListener('click', e => {
  const b = e.target.closest('[data-s]'); if(!b) return;
  const s = b.dataset.s;
  if(s === 'explore'){ menuEl.hidden = true; doneEl.hidden = true; if(active && active.finished){ active = null; returnItems(); } fire(); stage.focus({ preventScroll:true }); }
  else startScenario(s, b.dataset.m || 'guided');
}));
document.getElementById('scnBtn').onclick = showMenu;
document.getElementById('trainBtn').onclick = e => { e.currentTarget.classList.add('seen'); showMenu(); };

/* start */
resize();
camera.position.copy(HOME.pos); camera.quaternion.copy(poseFrom(HOME.pos, HOME.target)); camera.fov = homeFov(); look.fov = homeFov(); setLookFromQuat(camera.quaternion);
fire(); drawPump(0); drawClock();
requestAnimationFrame(frame);
document.getElementById('loading').hidden = true;
</script>
</body>
